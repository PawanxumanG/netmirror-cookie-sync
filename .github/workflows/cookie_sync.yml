name: NetMirror Auto Cookie & Token Sync

on:
  schedule:
    # Runs every 4 hours at minute 17 (00:17, 04:17, 08:17, 12:17, 16:17, 20:17 UTC)
    - cron: '17 */4 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Web UI
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: cookie-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Cookie & TV Token Sync to Firebase
        run: |
          python -u cookie_sync.py

      - name: Update Timestamp & Prevent Inactivity Pause
        if: always()
        run: |
          date -u +"%Y-%m-%d %H:%M:%S UTC" > last_sync.txt
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add last_sync.txt
          git commit -m "Auto-sync update [skip ci]" || echo "No changes to commit"
          git push || echo "Push skipped"
