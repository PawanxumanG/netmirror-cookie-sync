name: NetMirror Daily Cookie Sync

on:
  schedule:
    # Runs automatically every 2 hours so cookies never expire
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows manual run button in GitHub web UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Cookie Sync
        run: python cookie_sync.py
