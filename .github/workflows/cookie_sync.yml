name: NetMirror 3-Hour Cookie & Token Sync

on:
  schedule:
    # Runs automatically every 3 hours (using minute 15 to avoid GitHub peak rush-hour delays)
    - cron: '15 */3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Web UI
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: cookie-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Cookie & TV Token Sync to Firebase
        run: |
          python -u cookie_sync.py

      - name: Update Timestamp & Prevent Inactivity Pause
        if: always()
        run: |
          date -u +"%Y-%m-%d %H:%M:%S UTC" > last_sync.txt
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add last_sync.txt
          git commit -m "Auto-sync update [skip ci]" || echo "No changes to commit"
          git push || echo "Push skipped"



