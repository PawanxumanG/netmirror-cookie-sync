name: NetMirror High-Frequency Cookie Sync

on:
  schedule:
    # Staggered odd-minute schedules to avoid GitHub Actions peak queue delays
    - cron: '12,42 * * * *'
    - cron: '27,57 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Web UI
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: cookie-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Continuous Cookie Sync to Firebase (Active Cloud Loop)
        run: |
          python -u cookie_sync.py --loop 45 --interval 15

      - name: Update Timestamp & Prevent Workflow Inactivity Pause
        if: always()
        run: |
          date -u +"%Y-%m-%d %H:%M:%S UTC" > last_sync.txt
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add last_sync.txt
          git commit -m "Auto-sync update [skip ci]" || echo "No changes to commit"
          git push || echo "Push skipped"


